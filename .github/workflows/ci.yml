name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Tests (unit, in-memory MCP, HTTP auth, and Postgres)
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://helpdesk:helpdesk@localhost:5432/helpdesk
      - name: Docker image builds
        run: docker build -t helpdesk-mcp .
